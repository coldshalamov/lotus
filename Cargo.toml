[package]
name = "lotus"
version = "0.2.0"
edition = "2024"
authors = ["Lotus maintainers"]
description = "Canonical parametric bit-level integer codec with tiered self-delimiting headers"
license = "Apache-2.0"
repository = "https://github.com/coldshalamov/lotus"
homepage = "https://github.com/coldshalamov/lotus"
documentation = "https://docs.rs/lotus"
keywords = ["codec", "compression", "integer", "bitstream", "varint"]
categories = ["compression", "encoding"]
readme = "README.md"
rust-version = "1.85"

[features]
default = []
bigint = ["dep:num-bigint", "dep:num-traits"]
cli = ["dep:clap", "dep:hex", "dep:serde", "dep:serde_json"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
rand = "0.8"

[[bench]]
name = "comparison"
harness = false

[[bin]]
name = "lotus"
path = "src/bin/lotus.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
