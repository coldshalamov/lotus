name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

      - name: Verify generated benchmark artifacts
        run: scripts/check_generated.sh

      - name: Verify browser demo contract
        run: |
          node --check docs/lotus-core.mjs
          node --check docs/demo.mjs
          node --check scripts/check_demo.mjs
          node scripts/check_demo.mjs

      - name: Bench smoke test
        run: cargo bench --bench comparison -- --sample-size 10
